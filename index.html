<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>毎日のタスク</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タスク">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1216">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0f1216;--card:#1a1f26;--card2:#222933;--line:#2c3440;
  --tx:#eef1f5;--sub:#8a95a5;--accent:#4fc3f7;--accent2:#1e88b8;--done:#3ddc97;--warn:#ff6b6b;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f3f5f8;--card:#fff;--card2:#eef2f6;--line:#dde3ea;--tx:#141a22;--sub:#6b7686;--accent:#0a84c6;--accent2:#0a6aa0;--done:#17a673;--warn:#d93a3a;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 96px) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.daterow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navbtn{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px}
.datebox{text-align:center;flex:1}
.date{font-size:20px;font-weight:700}
.todaybtn{font-size:12px;color:var(--accent);margin-top:2px;min-height:18px}
.bar{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog{flex:1;height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.cnt{font-size:13px;color:var(--sub);white-space:nowrap}
.opts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--card);color:var(--sub);border:1px solid var(--line)}
.chip.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
main{padding:12px 16px}
.task{display:flex;align-items:stretch;background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden;border:1px solid var(--line);transition:opacity .2s}
.task.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.time{width:84px;flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--card2);padding:10px 4px;gap:2px}
.time b{font-size:17px;font-variant-numeric:tabular-nums}
.time span{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.body{flex:1;padding:10px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.title{font-size:16px;font-weight:600;word-break:break-word;text-align:left;padding:0}
.shift{display:flex;gap:6px}
.shift button{white-space:nowrap;font-size:12px;padding:5px 9px;border-radius:8px;background:var(--card2);color:var(--sub);font-variant-numeric:tabular-nums}
.shift button:active{background:var(--accent2);color:#fff}
.chk{width:64px;flex:none;display:flex;align-items:center;justify-content:center}
.chk i{width:34px;height:34px;border-radius:50%;border:2px solid var(--sub);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;transition:all .15s}
.task.done{opacity:.55}
.task.done .title{text-decoration:line-through}
.task.done .chk i{background:var(--done);border-color:var(--done);color:#fff}
.task.done .shift{display:none}
.title.ph{color:var(--sub);font-weight:400}
.gear{margin-left:auto;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--card);color:var(--sub);border:1px solid var(--line);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sub);display:inline-block}
.dot.ok{background:var(--done)}.dot.ng{background:var(--warn)}
.cfgbtn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:12px;font-weight:600;font-size:15px}
#cfgStatus{font-size:13px;line-height:1.7;margin-top:12px;white-space:pre-wrap}
.nowtag{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.05em}
.empty{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.8}
.empty button{margin-top:12px;padding:10px 16px;border-radius:12px;background:var(--accent2);color:#fff;font-weight:600}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--accent2);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:6}
.foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 16px}
.foot button{font-size:12px;color:var(--sub);padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:.95}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;top:0;z-index:11;background:var(--card);border-radius:0 0 20px 20px;padding:calc(12px + env(safe-area-inset-top)) 16px 20px;transform:translateY(-105%);transition:transform .22s ease;max-height:85dvh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.shead h3{margin:0;font-size:16px;flex:1;text-align:center}
.shead button{padding:10px 14px;border-radius:12px;font-weight:600;font-size:15px;min-width:80px}
.sheet.open{transform:none}
.sheet h3{margin:0 0 12px;font-size:16px}
.sheet label{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px}
.sheet input[type=text]{width:100%;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.tblock{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcol{background:var(--bg);border-radius:12px;padding:10px;border:1px solid var(--line);text-align:center}
.tcol .lbl{font-size:11px;color:var(--sub)}
.tcol .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0}
.tcol .val{display:flex;align-items:center;justify-content:center;gap:2px}
.tcol select{-webkit-appearance:none;appearance:none;font:inherit;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx);background:var(--card2);border:0;border-radius:8px;padding:2px 6px;text-align:center;text-align-last:center}
.steps{display:flex;gap:6px;justify-content:center}
.steps button{flex:1;padding:8px 0;border-radius:8px;background:var(--card2);font-size:13px}
.steps button:active{background:var(--accent2);color:#fff}
.durs{display:flex;gap:6px;flex-wrap:wrap}
.durs button{padding:8px 12px;border-radius:10px;background:var(--card2);font-size:13px}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;padding:14px;border-radius:12px;font-weight:600;font-size:15px}
.primary{background:var(--accent2);color:#fff}
.ghost{background:var(--card2)}
.danger{color:var(--warn);background:var(--card2)}
.danger.arm{background:var(--warn);color:#fff}
.hint{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="daterow">
    <button class="navbtn" id="prev" aria-label="前の日">‹</button>
    <div class="datebox"><div class="date" id="date"></div><button class="todaybtn" id="today"></button></div>
    <button class="navbtn" id="next" aria-label="次の日">›</button>
  </div>
  <div class="bar"><div class="prog"><i id="progbar"></i></div><div class="cnt" id="cnt"></div></div>
  <div class="opts">
    <button class="chip on" id="cascade">後ろのタスクも一緒にずらす</button>
    <button class="chip" id="hide">済を隠す</button>
    <button class="gear" id="gear"><span class="dot" id="syncDot"></span>設定</button>
  </div>
</header>
<main id="list"></main>
<div class="foot">
  <button id="saveTpl">この日をルーティンとして保存</button>
  <button id="applyTpl">ルーティンを読み込む</button>
</div>
<button class="fab" id="add" aria-label="タスクを追加">＋</button>
<div class="toast" id="toast"></div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="shead">
    <button class="ghost" id="cancel">閉じる</button>
    <h3 id="sheetTitle">タスクを追加</h3>
    <button class="primary" id="save">保存</button>
  </div>
  <div class="hint" id="sMsg" style="color:var(--warn);font-size:13px;min-height:0"></div>
  <label>タスク(空欄でもOK・空欄は通知しません)</label>
  <input type="text" id="fTitle" placeholder="例:朝ごはん" enterkeyhint="done">
  <label>時間(数字をタップして選択)</label>
  <div class="tblock">
    <div class="tcol">
      <div class="lbl">開始</div>
      <div class="val"><select id="sH"></select><span>:</span><select id="sM"></select></div>
      <div class="steps"><button data-t="s" data-d="-15">−15</button><button data-t="s" data-d="15">+15</button></div>
    </div>
    <div class="tcol">
      <div class="lbl">終了</div>
      <div class="val"><select id="eH"></select><span>:</span><select id="eM"></select></div>
      <div class="steps"><button data-t="e" data-d="-15">−15</button><button data-t="e" data-d="15">+15</button></div>
    </div>
  </div>
  <label>長さ</label>
  <div class="durs" id="durs">
    <button data-m="15">15分</button><button data-m="30">30分</button><button data-m="60">1時間</button><button data-m="90">1.5時間</button><button data-m="120">2時間</button>
  </div>
  <div class="row">
    <button class="danger" id="del" style="display:none">削除</button>
  </div>
  <div class="hint" id="delHint" style="display:none">もう一度押すと削除します</div>
</div>

<div class="sheet" id="cfg">
  <div class="shead">
    <button class="ghost" id="cfgClose">閉じる</button>
    <h3>同期と通知</h3>
    <span style="min-width:80px"></span>
  </div>
  <label>サーバーURL</label>
  <input type="text" id="cfgUrl" placeholder="https://〜.workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label>合言葉</label>
  <input type="text" id="cfgToken" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="cfgbtn primary" id="cfgSave">保存して接続</button>
  <button class="cfgbtn ghost" id="cfgPush">通知をオンにする</button>
  <button class="cfgbtn ghost" id="cfgTest">テスト通知を送る</button>
  <div id="cfgStatus"></div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>{m=Math.max(0,Math.min(1440,m));return pad(Math.floor(m/60))+':'+pad(m%60)};
const parse=s=>{const [h,mm]=s.split(':').map(Number);return h*60+mm};
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const WD='日月火水木金土';
const uid=()=>Math.random().toString(36).slice(2,9);

let cur=new Date();cur.setHours(0,0,0,0);
let days={};          // key -> tasks[]
let template=null;    // tasks[]
let cascade=true,hideDone=false;
let dayTs={},tplTs=0;          // 同期用:最後に変更した時刻
let cfg={url:'',token:''};

/* ---------- storage: local first, cloud when available ---------- */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
(function loadLocal(){
  const d=lsGet('dt_days');if(d)days=d;
  template=lsGet('dt_tpl');
  const o=lsGet('dt_opts');if(o){cascade=o.cascade!==false;hideDone=!!o.hideDone}
  dayTs=lsGet('dt_dayTs')||{};tplTs=lsGet('dt_tplTs')||0;
  const c=lsGet('dt_cfg');if(c)cfg=c;
})();
function seedIfFirst(){
  if(Object.keys(days).length===0&&!template){
    template=[
      {id:uid(),s:420,e:450,t:'起床・身支度'},
      {id:uid(),s:450,e:480,t:'朝ごはん'},
      {id:uid(),s:540,e:720,t:'仕事(午前)'},
      {id:uid(),s:720,e:780,t:'昼ごはん'},
      {id:uid(),s:780,e:1080,t:'仕事(午後)'},
      {id:uid(),s:1140,e:1230,t:'ジム'},
      {id:uid(),s:1260,e:1320,t:'夜ごはん'}
    ];
  }
}
seedIfFirst();

// 数字だけの仮タスク名は空欄として扱う(初回のみ移行)
function isPlaceholder(t){return /^\s*[0-9０-９]+\s*$/.test(t||'')}
function migrate(arr){let ch=false;(arr||[]).forEach(x=>{if(x&&isPlaceholder(x.t)){x.t='';ch=true}});return ch}
(function(){
  if(lsGet('dt_mig1'))return;
  Object.keys(days).forEach(k=>{if(days[k]&&migrate(days[k]))dayTs[k]=Date.now()});
  if(template&&migrate(template))tplTs=Date.now();
  lsSet('dt_days',days);lsSet('dt_tpl',template);lsSet('dt_dayTs',dayTs);lsSet('dt_tplTs',tplTs);lsSet('dt_mig1',1);
})();

function persistDay(k,auto){
  dayTs[k]=auto?(dayTs[k]||1):Date.now();
  lsSet('dt_days',days);lsSet('dt_dayTs',dayTs);
  schedulePush();
}
function persistTpl(){
  tplTs=Date.now();
  lsSet('dt_tpl',template);lsSet('dt_tplTs',tplTs);
  schedulePush();
}

/* ---------- サーバー同期 ---------- */
let pushTimer=null,syncing=false;
function online(){return !!(cfg.url&&cfg.token)}
function api(path,opt){
  opt=opt||{};
  return fetch(cfg.url.replace(/\/+$/,'')+path,Object.assign({},opt,{headers:Object.assign({'Authorization':'Bearer '+cfg.token,'Content-Type':'application/json'},opt.headers||{})}))
    .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j});
}
function setDot(st){const d=$('syncDot');d.className='dot'+(st==='ok'?' ok':st==='ng'?' ng':'')}
function applyServer(sv){
  let changed=false;
  Object.keys(sv.days||{}).forEach(k=>{
    const ts=(sv.dayTs||{})[k]||0;
    if(!days[k]||ts>(dayTs[k]||0)){days[k]=JSON.parse(JSON.stringify(sv.days[k]));dayTs[k]=ts;changed=true}
  });
  if((sv.tplTs||0)>tplTs){template=JSON.parse(JSON.stringify(sv.template));tplTs=sv.tplTs;changed=true}
  if(changed){lsSet('dt_days',days);lsSet('dt_dayTs',dayTs);lsSet('dt_tpl',template);lsSet('dt_tplTs',tplTs)}
  return changed;
}
function needsPush(sv){
  if(tplTs>(sv.tplTs||0))return true;
  return Object.keys(days).some(k=>days[k]&&(dayTs[k]||0)>((sv.dayTs||{})[k]||0));
}
function recentDays(){
  const cut=new Date();cut.setDate(cut.getDate()-60);const ck=keyOf(cut);const o={},t={};
  Object.keys(days).forEach(k=>{if(k>=ck&&days[k]){o[k]=days[k];t[k]=dayTs[k]||0}});return {days:o,dayTs:t};
}
async function pushNow(){
  if(!online())return;
  try{
    const r=recentDays();
    const sv=await api('/api/state',{method:'PUT',body:JSON.stringify({days:r.days,dayTs:r.dayTs,template,tplTs})});
    if(applyServer(sv))render();
    setDot('ok');
  }catch(e){setDot('ng')}
}
function schedulePush(){if(!online())return;clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,1200)}
async function pullNow(){
  if(!online()||syncing)return;syncing=true;
  try{
    const sv=await api('/api/state');
    if(applyServer(sv)&&!$('sheet').classList.contains('open'))render();
    if(needsPush(sv))await pushNow();
    setDot('ok');
  }catch(e){setDot('ng')}
  syncing=false;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullNow();else if(pushTimer){clearTimeout(pushTimer);pushNow()}});
function persistOpts(){lsSet('dt_opts',{cascade,hideDone})}

function loadCloudDay(){}

/* ---------- helpers ---------- */
function tasks(){const k=keyOf(cur);if(!days[k])days[k]=null;return days[k]}
function ensureDay(){
  const k=keyOf(cur);
  if(!days[k])days[k]=template?template.map(x=>({id:uid(),s:x.s,e:x.e,t:x.t,done:false})):[];
  return days[k];
}
function sortT(arr){arr.sort((a,b)=>a.s-b.s||a.e-b.e)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1400)}
function isToday(){return keyOf(cur)===keyOf(new Date())}

/* ---------- render ---------- */
function render(){
  const k=keyOf(cur);
  $('date').textContent=(cur.getMonth()+1)+'月'+cur.getDate()+'日('+WD[cur.getDay()]+')';
  $('today').textContent=isToday()?'今日':'今日に戻る';
  $('cascade').classList.toggle('on',cascade);
  $('hide').classList.toggle('on',hideDone);
  const list=$('list');list.innerHTML='';
  let arr=days[k];
  if(!arr){
    // 未作成の日:ルーティンから自動作成
    if(template&&template.length){arr=ensureDay();persistDay(k,true)}
    else arr=[];
  }
  const done=arr.filter(x=>x.done).length;
  $('cnt').textContent=done+' / '+arr.length+' 済';
  $('progbar').style.width=arr.length?(done/arr.length*100)+'%':'0';
  if(!arr.length){
    list.innerHTML='<div class="empty">この日のタスクはまだありません。<br>右下の＋で追加できます。'+(template&&template.length?'<br><button id="useTpl">ルーティンを読み込む</button>':'')+'</div>';
    const b=$('useTpl');if(b)b.onclick=applyTemplate;
    return;
  }
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  arr.forEach(x=>{
    if(hideDone&&x.done)return;
    const el=document.createElement('div');
    const isNow=isToday()&&!x.done&&nm>=x.s&&nm<x.e;
    el.className='task'+(x.done?' done':'')+(isNow?' now':'');
    el.innerHTML=
      '<button class="time" data-act="edit"><b>'+fmt(x.s)+'</b><span>〜'+fmt(x.e)+'</span>'+(isNow?'<span class="nowtag">NOW</span>':'')+'</button>'+
      '<div class="body"><button class="title" data-act="edit"></button>'+
      '<div class="shift"><button data-act="sh" data-d="-15">−15分</button><button data-act="sh" data-d="15">+15分</button><button data-act="sh" data-d="30">+30分</button></div></div>'+
      '<button class="chk" data-act="done" aria-label="済にする"><i>'+(x.done?'済':'')+'</i></button>';
    const tt=el.querySelector('.title');tt.textContent=x.t||'(未入力)';if(!x.t)tt.classList.add('ph');
    el.addEventListener('click',ev=>{
      const b=ev.target.closest('[data-act]');if(!b)return;
      const a=b.dataset.act;
      if(a==='done'){const nd=!x.done;days[k]=days[k].map(y=>y.id===x.id?Object.assign({},y,{done:nd}):Object.assign({},y));persistDay(k);render();if(nd)toast(x.t?'「'+x.t+'」済':'済')}
      else if(a==='sh')shift(x,+b.dataset.d);
      else if(a==='edit')openSheet(x);
    });
    list.appendChild(el);
  });
}

function shift(x,d){
  const k=keyOf(cur),arr=days[k].map(y=>Object.assign({},y));days[k]=arr;
  const X=arr.find(y=>y.id===x.id);if(!X)return;
  const targets=cascade?arr.filter(y=>!y.done&&(y===X||y.s>=X.s)):[X];
  // 0:00〜24:00の範囲を超えないように
  const minS=Math.min(...targets.map(y=>y.s)),maxE=Math.max(...targets.map(y=>y.e));
  if(minS+d<0||maxE+d>1440){toast('これ以上ずらせません');return}
  targets.forEach(y=>{y.s+=d;y.e+=d});
  sortT(arr);persistDay(k);render();
  toast((cascade&&targets.length>1?targets.length+'件を':'')+(d>0?d+'分後ろへ':(-d)+'分前へ'));
}

/* ---------- sheet ---------- */
let editing=null,fs=0,fe=0,delArmed=false;
const snap=m=>Math.round(m/15)*15;
(function buildSelects(){
  const opt=(v,l)=>'<option value="'+v+'">'+l+'</option>';
  let h='';for(let i=0;i<24;i++)h+=opt(i,pad(i));
  $('sH').innerHTML=h;$('eH').innerHTML=h+opt(24,'24');
  const m=[0,15,30,45].map(x=>opt(x,pad(x))).join('');
  $('sM').innerHTML=m;$('eM').innerHTML=m;
})();
function syncTimes(){
  fs=snap(fs);fe=snap(fe);if(fe<=fs)fe=Math.min(1440,fs+15);
  $('sH').value=Math.floor(fs/60);$('sM').value=fs%60;
  $('eH').value=Math.floor(fe/60);$('eM').value=fe%60;
}
function readSel(p){return (+$(p+'H').value)*60+(+$(p+'M').value)}
['sH','sM'].forEach(id=>$(id).onchange=()=>{const dur=fe-fs;fs=Math.min(1425,readSel('s'));fe=Math.min(1440,fs+dur);syncTimes()});
['eH','eM'].forEach(id=>$(id).onchange=()=>{let v=readSel('e');if(v>1440)v=1440;fe=Math.max(fs+15,v);syncTimes()});
function openSheet(x){
  editing=x||null;$('sMsg').textContent='';delArmed=false;$('del').classList.remove('arm');$('delHint').style.display='none';
  const arr=days[keyOf(cur)]||[];
  if(x){fs=x.s;fe=x.e;$('fTitle').value=x.t;$('sheetTitle').textContent='タスクを編集';$('del').style.display=''}
  else{
    const last=arr.length?Math.max(...arr.map(y=>y.e)):null;
    const now=new Date();let base=last!=null?last:Math.ceil((now.getHours()*60+now.getMinutes())/15)*15;
    if(base>1380)base=1380;
    fs=base;fe=Math.min(1440,base+60);$('fTitle').value='';$('sheetTitle').textContent='タスクを追加';$('del').style.display='none';
  }
  syncTimes();
  $('mask').style.display='block';requestAnimationFrame(()=>$('sheet').classList.add('open'));
}
function closeSheet(){$('sheet').classList.remove('open');$('mask').style.display='none';$('fTitle').blur()}
document.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>{
  const d=+b.dataset.d;
  if(b.dataset.t==='s'){const dur=fe-fs;fs=Math.max(0,Math.min(1440-15,fs+d));fe=Math.min(1440,fs+dur)}
  else{fe=Math.max(fs+15,Math.min(1440,fe+d))}
  syncTimes();
});
$('durs').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;fe=Math.min(1440,fs+ +b.dataset.m);syncTimes()};
$('save').onclick=()=>{
  const msg=$('sMsg');msg.textContent='';
  try{
    const t=$('fTitle').value.trim();
    const k=keyOf(cur);
    const arr=ensureDay().map(y=>Object.assign({},y));
    if(editing){const i=arr.findIndex(y=>y.id===editing.id);if(i>=0)Object.assign(arr[i],{t,s:fs,e:fe})}
    else arr.push({id:uid(),s:fs,e:fe,t,done:false});
    sortT(arr);days[k]=arr;persistDay(k);closeSheet();render();
  }catch(err){msg.textContent='保存できませんでした:'+(err&&err.message||err)}
};
$('fTitle').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('save').click()}});
$('cancel').onclick=closeSheet;$('mask').onclick=closeSheet;
$('del').onclick=()=>{
  if(!delArmed){delArmed=true;$('del').classList.add('arm');$('delHint').style.display='block';return}
  const k=keyOf(cur);days[k]=days[k].filter(y=>y.id!==editing.id);persistDay(k);closeSheet();render();toast('削除しました');
};

/* ---------- template ---------- */
function applyTemplate(){
  if(!template||!template.length){toast('ルーティンが未保存です');return}
  const k=keyOf(cur);
  days[k]=template.map(x=>({id:uid(),s:x.s,e:x.e,t:x.t,done:false}));
  persistDay(k);render();toast('ルーティンを読み込みました');
}
$('saveTpl').onclick=()=>{
  const arr=days[keyOf(cur)]||[];if(!arr.length){toast('タスクがありません');return}
  template=arr.map(x=>({s:x.s,e:x.e,t:x.t}));persistTpl();toast('ルーティンとして保存しました');
};
let applyArmed=false;
$('applyTpl').onclick=()=>{
  const arr=days[keyOf(cur)]||[];
  if(arr.length&&!applyArmed){applyArmed=true;toast('もう一度押すと今の予定を置き換えます');setTimeout(()=>applyArmed=false,3000);return}
  applyArmed=false;applyTemplate();
};

/* ---------- nav ---------- */
function go(n){cur.setDate(cur.getDate()+n);render();loadCloudDay(keyOf(cur))}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('today').onclick=()=>{cur=new Date();cur.setHours(0,0,0,0);render();loadCloudDay(keyOf(cur))};
$('add').onclick=()=>openSheet(null);
$('cascade').onclick=()=>{cascade=!cascade;persistOpts();render();toast(cascade?'後ろのタスクも一緒にずらします':'そのタスクだけずらします')};
$('hide').onclick=()=>{hideDone=!hideDone;persistOpts();render()};

// swipe left/right on list to change day
let sx=null,sy=null;
$('list').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('list').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<40)go(dx<0?1:-1);sx=null},{passive:true});

setInterval(()=>{if(isToday()&&!$('sheet').classList.contains('open'))render()},60000);

/* ---------- 設定:同期と通知 ---------- */
const b64ToU8=b=>{b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const r=atob(b),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u};
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function cfgMsg(t){$('cfgStatus').textContent=t}
function cfgRefresh(){
  const lines=[];
  lines.push(online()?'サーバー:設定済み':'サーバー:未設定');
  if(!('Notification' in window)||!('serviceWorker' in navigator))lines.push('通知:このブラウザでは使えません'+(isStandalone()?'':'(ホーム画面から開いてください)'));
  else lines.push('通知:'+({granted:'オン',denied:'拒否されています(iPhoneの設定→通知から許可)',default:'まだオンにしていません'})[Notification.permission]);
  cfgMsg(lines.join('\n'));
}
function openCfg(){
  $('cfgUrl').value=cfg.url||'';$('cfgToken').value=cfg.token||'';cfgRefresh();
  $('mask').style.display='block';requestAnimationFrame(()=>$('cfg').classList.add('open'));
}
function closeCfg(){$('cfg').classList.remove('open');$('mask').style.display='none';document.activeElement&&document.activeElement.blur()}
$('gear').onclick=openCfg;$('cfgClose').onclick=closeCfg;
$('mask').addEventListener('click',closeCfg);
$('cfgSave').onclick=async()=>{
  cfg={url:$('cfgUrl').value.trim(),token:$('cfgToken').value.trim()};lsSet('dt_cfg',cfg);
  if(!online()){cfgMsg('URLと合言葉の両方を入れてください');return}
  cfgMsg('接続中…');
  try{await api('/api/state');await pullNow();await pushNow();cfgMsg('接続できました。予定をサーバーと同期しました。\n次に「通知をオンにする」を押してください。')}
  catch(e){setDot('ng');cfgMsg('接続できませんでした:'+e.message+'\nURLと合言葉を確認してください。')}
};
async function subscribePush(){
  if(!online())throw new Error('先にサーバーURLと合言葉を保存してください');
  if(!('serviceWorker' in navigator)||!('PushManager' in window))throw new Error(isStandalone()?'この端末では通知が使えません(iOS 16.4以降が必要です)':'ホーム画面に追加したアイコンから開いて、もう一度押してください');
  const perm=await Notification.requestPermission();
  if(perm!=='granted')throw new Error('通知が許可されませんでした');
  const reg=await navigator.serviceWorker.ready;
  const {publicKey}=await api('/api/vapid');
  let sub=await reg.pushManager.getSubscription();
  if(sub&&sub.options&&sub.options.applicationServerKey){
    const cur=new Uint8Array(sub.options.applicationServerKey),want=b64ToU8(publicKey);
    if(cur.length!==want.length||cur.some((v,i)=>v!==want[i])){await sub.unsubscribe();sub=null}
  }
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(publicKey)});
  await api('/api/subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON()})});
}
$('cfgPush').onclick=async()=>{
  cfgMsg('設定中…');
  try{await subscribePush();cfgRefresh();cfgMsg($('cfgStatus').textContent+'\n通知の登録ができました。「テスト通知を送る」で確認できます。')}
  catch(e){cfgMsg('通知をオンにできませんでした:'+e.message)}
};
$('cfgTest').onclick=async()=>{
  cfgMsg('送信中…');
  try{const r=await api('/api/test',{method:'POST'});cfgMsg(r.sent?'送りました。数秒で届きます。':'送れませんでした'+(r.note?':'+r.note:'('+JSON.stringify(r.results)+')'))}
  catch(e){cfgMsg('送れませんでした:'+e.message)}
};
// 通知の登録は時々更新しておく(iPhoneが登録を入れ替えることがあるため)
async function refreshSub(){
  try{
    if(!online()||!('serviceWorker' in navigator)||Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    if(sub)await api('/api/subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON()})});
    else await subscribePush();
  }catch(e){}
}
render();
setDot(online()?'':'');pullNow();setTimeout(refreshSub,3000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
